---
version: 2
updates:
  # Actions are pinned by SHA — Dependabot bumps the SHA and the version comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly

  # Provider versions in .terraform.lock.hcl
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/lab
    schedule:
      interval: weekly
