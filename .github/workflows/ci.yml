---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBERNETES_VERSION: "1.35.0"

# Три job'а запускаются всегда, без фильтров по путям: required checks
# с paths-фильтром на PR, который их не затрагивает, висят в ожидании вечно
jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: yamllint
        run: |
          pip install yamllint==1.38.0
          yamllint .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # Бэкенд в OCI из GitHub недоступен (и не нужен) — validate без него
      - name: terraform validate
        run: |
          for root in bootstrap envs/lab; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: install lint tools
        run: pip install -r requirements.txt

      - name: install collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      # ansible.cfg указывает на ~/.vault_pass_homelab, которого здесь нет.
      # Линтеры vault не расшифровывают, подойдёт любой пароль.
      - name: dummy vault password
        run: echo "ci-dummy" > "$RUNNER_TEMP/vault_pass"

      - name: ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ runner.temp }}/vault_pass
        run: ansible-lint

      # TODO: syntax-check playbooks/site.yml — когда появится site.yml

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -strict: неизвестное поле (опечатка) — ошибка, а не тихий пропуск
      - name: kubeconform
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          --entrypoint /kubeconform
          ghcr.io/yannh/kubeconform:v0.8.0-alpine
          -strict -summary -kubernetes-version "$KUBERNETES_VERSION" k8s/
