---
# defaults file for roles/firewall
firewall_chain: FIREWALL-INPUT
firewall_config_dir: /etc/firewall

# Interfaces with everything allowed.
# SSH is closed from outside — the host is reachable only through wg0.
firewall_trusted_interfaces:
  - lo
  - wg0

# Ports open to the internet
firewall_public_tcp_ports: []
firewall_public_udp_ports:
  - 51820  # WireGuard

firewall_ipv6: true

# Seconds before the rules are removed automatically if access is not confirmed
firewall_rollback_timeout: 300

# Check from the control machine that SSH on the public address is closed
firewall_check_ssh_closed: true
firewall_public_address: "{{ ansible_facts['default_ipv4']['address'] }}"
