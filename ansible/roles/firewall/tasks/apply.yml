---
# Apply rules with a rollback: if a new connection fails after applying,
# a timer removes the rules after firewall_rollback_timeout seconds.

- name: Remove stale rollback timer
  ansible.builtin.systemd_service:
    name: firewall-rollback.timer
    state: stopped
  failed_when: false

- name: Arm rollback timer
  ansible.builtin.command: >-
    systemd-run --collect
    --unit=firewall-rollback
    --on-active={{ firewall_rollback_timeout }}
    /usr/local/sbin/firewall-rollback
  changed_when: true

- name: Apply firewall rules
  ansible.builtin.systemd_service:
    name: firewall
    state: restarted
    daemon_reload: true

# The current SSH session is already ESTABLISHED and survives any rules.
# Test a new connection — through wg0, the only way into the host.
- name: Drop current SSH connection
  ansible.builtin.meta: reset_connection

- name: Check that a new connection through wg0 works
  ansible.builtin.wait_for_connection:
    timeout: 30

- name: Disarm rollback timer
  ansible.builtin.systemd_service:
    name: firewall-rollback.timer
    state: stopped

# Access confirmed. Now make sure SSH is really closed from outside.
- name: Check that SSH on public address is closed
  ansible.builtin.wait_for:
    host: "{{ firewall_public_address }}"
    port: 22
    state: stopped
    connect_timeout: 5
    timeout: 15
  delegate_to: localhost
  become: false
  when: firewall_check_ssh_closed
