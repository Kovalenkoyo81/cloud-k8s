---
# defaults file for roles/admin_user
admin_user_name: devops
admin_user_groups:
  - sudo

# Public keys allowed to log in as admin_user_name.
# Keys are added to the existing ones, not replacing them.
admin_user_authorized_keys: []

# SHA-512 password hash (for sudo). Unset — the password is not changed.
# admin_user_password_hash: "{{ vault_... }}"
